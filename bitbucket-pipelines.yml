image: python:3.11

pipelines:
  pull-requests:
    '**':
      - step:
          name: 🤖 AI Code Review - PR
          script:
            - pip install -r requirements.txt
            - python scripts/gemini_pr_review.py
          artifacts:
            - pr-review.json

  branches:
    develop:
      - step:
          name: 🤖 AI Code Review - Develop
          trigger: manual
          script:
            - pip install -r requirements.txt
            - python scripts/gemini_code_review.py
          artifacts:
            - code-review-report.md

    main:
      - step:
          name: 🤖 AI Code Review - Main
          trigger: manual
          script:
            - pip install -r requirements.txt
            - python scripts/gemini_code_review.py
          artifacts:
            - code-review-report.md

  custom:
    full-review:
      - step:
          name: 🤖 Full Repository Code Review
          script:
            - pip install -r requirements.txt
            - python scripts/gemini_code_review.py
          artifacts:
            - code-review-report.md